name: Refresh Roblox portfolio

on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/data/portfolio.json'
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/refresh-portfolio.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/portfolio-live.json assets/js/portfolio-data.js
          git diff --cached --quiet || git commit -m "chore: refresh Roblox portfolio data"
          git push
